# oneclass3d configuration.
# One-class anomaly detection on MVTec 3D-AD: fit on normal scans only, flag defects.
# Patch descriptors are cached once by extract.py; six scorers are compared on them,
# each on RAW and WHITENED features.

paths:
  cache_dir: cache/features      # *_abs.npz (FPFH) + *_mm.npz (multimodal) caches
  data_root: data/mvtec3d        # raw MVTec 3D-AD download (xyz + rgb, read by extract.py)
  tables_dir: results/tables
  figures_dir: results/figures

# ---- Feature representation ------------------------------------------------
# Selects which cache the whole pipeline reads (load_cache appends _<features>):
#   abs   -> 33-dim geometry-only FPFH (`extract.py geom`)
#   mm    -> 417-dim multimodal L2(concat(FPFH_33, L2(DINOv2_384))) (`extract.py rgb`)
#   mm_v3 -> the same with DINOv3 tokens (`extract.py rgb_v3`)
# Every scorer / whitener / run / plot is dimension-agnostic.
features: abs

# Width of the FPFH (geometry) block = the split point for block-wise whitening of the
# mm descriptor concat(FPFH, DINOv2). Must equal the FPFH dimension (33); unused by the
# geometry-only path.
geom_dim: 33

# ---- RGB branch: frozen DINOv2 patch tokens (`extract.py rgb`) --------------
# DINOv2 ViT-S/14 at image_size 392 emits 392/14 = 28x28 = 784 tokens, the same 28x28
# grid the FPFH pipeline pools into, so token (i,j) aligns to FPFH patch (i,j).
rgb:
  backbone: vit_small_patch14_dinov2.lvd142m   # timm; 384-dim patch tokens, patch 14
  image_size: 392
  patch_size: 14

# ---- Alternative RGB branch: frozen DINOv3 patch tokens (`extract.py rgb_v3`) -----
# DINOv3 ViT-S/16 at image_size 448 also emits a 28x28 grid of 384-dim tokens. Scored
# with `features: mm_v3`. License: the custom "DINOv3 License" (commercial and research
# use and redistribution allowed with a "Built with DINOv3" attribution and a copy of
# the license; publications must acknowledge DINOv3), unlike DINOv2's Apache 2.0.
rgb_v3:
  backbone: vit_small_patch16_dinov3.lvd1689m  # timm; 384-dim patch tokens, patch 16
  image_size: 448
  patch_size: 16

# ---- Geometry feature extraction (`extract.py geom` -> *_abs.npz) -----------
# Raw organized xyz scans -> preprocess -> per-point FPFH -> 28x28 patches. FPFH
# radii are absolute (0.1 / 0.25 m); the RANSAC plane distance is scale-relative.
# Deterministic given base_seed (Open3D global RNG is seeded once).
resample_grid: 224           # organized cloud resampled to 224x224
ransac:                      # border-seeded plane removal (background reaches the border)
  enabled: true              # false keeps the plane (plane-removal ablation)
  border_strip_px: 10
  ransac_n: 50
  num_iterations: 1000
  plane_thresh_rel: 0.01     # plane distance = fraction of the bbox diagonal...
  plane_thresh_abs_fallback: 0.005   # ...with this absolute fallback (m)
cleanup:                     # DBSCAN: keep the largest component, drop floaters
  enabled: true              # false skips the connected-component cleanup
  dbscan_eps_mode: abs       # abs: fixed dbscan_eps | rel: dbscan_eps_rel * bbox diagonal
                             #   | adaptive: per-scan k-distance heuristic (Ester et al.
                             #   1996, elbow at k = dbscan_min_points). See RESULTS.md.
  dbscan_eps: 0.006          # abs mode's fixed threshold (m)
  dbscan_eps_rel: 0.035      # rel mode: eps = this * bbox diagonal of the valid points
                             #   (~0.006/0.17, matches the abs value on a typical
                             #   post-RANSAC bbox diagonal)
  dbscan_eps_percentile: 90.0   # adaptive mode: percentile of the k-th NN distance distribution
  dbscan_min_points: 30
patch_grid: 28               # 28x28 patches = 8x8 px average-pool of the 224x224 grid
min_valid_per_patch: 16      # drop patches with fewer valid contributing points
fpfh:
  normal_radius_abs: 0.1     # absolute radius for normal estimation (m)
  fpfh_radius_abs: 0.25      # absolute radius for the FPFH support (m)
  max_nn: 100
  norm_tol: 1.0e-4           # ||x|| ~= 1 guard tolerance

# 10 MVTec 3D-AD object categories.
classes:
  - bagel
  - cable_gland
  - carrot
  - cookie
  - dowel
  - foam
  - peach
  - potato
  - rope
  - tire

# ---- Memory bank ----------------------------------------------------------
bank_cap: null     # null = full normal bank per class (reported setting, ~10 min).
                   # An int (e.g. 12000 -> ~4 min, 8000 -> ~3 min) caps EVERY scorer's
                   # bank to that many patches (a coreset, see bank_mode). Mean AUROCs
                   # drop by up to ~0.03 and run.py's reproduction check widens from
                   # exact to a +/-0.05 band. For fast iteration only.
bank_mode: uniform # how bank_cap subsamples: uniform (seeded random subset)
                   # | kcenter (greedy k-center / farthest-point coreset, PatchCore-style;
                   # deterministic given base_seed). Compared by bank_size.py.
base_seed: 0       # seed for the deterministic bank-cap subsample

# ---- Patch -> image aggregation -------------------------------------------
# null  -> image normality = MIN over a scan's patches (= max patch anomaly; default).
# float -> mean of the lowest-normality ceil(topk_frac * n) patches per scan
#          (e.g. 0.01 = worst 1%). Swept by topk_sweep.py.
topk_frac: null

# ---- Scorers and their fixed hyperparameters --------------------------------
# Documented defaults, never tuned on the test set. Modern Hopfield's beta is also
# swept by plot.py; the main table uses the single default below.
scorers:
  knn:               {k: 1}                  # negative distance to the 1st nearest normal patch
  modern_hopfield:   {beta: 100.0}           # (1/b) logsumexp(b * Xi^T x); soft NN. beta: auto
                                             #   picks it per class from normals only (select_beta)
  mahalanobis:       {kmeans_k: 50, kmeans_seed: 0}  # -min over k-means clusters of the Ledoit-Wolf
                                             #   Mahalanobis distance (robustness studies only)
  kde:               {bandwidth: scott}      # Gaussian KDE; Scott's rule at the bank count
  ocsvm:             {nu: 0.1, gamma: scale} # one-class RBF SVM (see ocsvm_* below)
  centroid:          {}                      # x . mean-direction (maximum-bias baseline)
  classical_hopfield: {}                     # ||Xi^T x||^2 (quadratic, sign-blind baseline)
  hybrid:            {alpha: auto, knn_k: 1, kmeans_k: 50, kmeans_seed: 0}  # alpha*z(kNN) +
                                             #   (1-alpha)*z(Mahalanobis); alpha: auto picks it
                                             #   from normals only (select_alpha). Robustness
                                             #   studies only, like mahalanobis.

ocsvm_max_fit: 2000      # |Xi| above which OC-SVM's exact-kernel path subsamples (training cost is super-linear)
ocsvm_nystroem_components: 500   # RBF landmarks for the full-bank path: Nystroem features + a
                                 # linear SGD one-class fit on the WHOLE bank; null falls back
                                 # to the exact-kernel subsample above.

beta_sweep: [1, 10, 100, 1000]   # Modern Hopfield betas for the plot.py sweep figure

# ---- Robustness study: bank contamination (contamination.py) -----------------
# Replace a fraction of the bank with patches drawn from DEFECTIVE test scans. Each
# class's defect scans are split in half BY SCAN (seeded): an injection pool that feeds
# the bank and an evaluation pool that is scored -- a scan never appears in both, and the
# evaluation set (good scans + eval-pool scans) is identical across contamination levels
# within a seed (so 0% rows differ from auroc.csv, which uses all defects).
contamination:
  levels: [0.0, 0.05, 0.10]  # fraction of bank patches replaced by injection-pool patches
  seeds: [0, 1, 2]           # seed both the scan split and the injection sampling
  bank_cap: 12000            # compute control: the question is how scorers separate,
                             # not absolute AUROC
  scorers:                   # variants per representation (mm matmul cost is ~12x abs)
    abs: [knn, modern_hopfield, modern_hopfield_auto, mahalanobis, kde]
    mm:  [knn, modern_hopfield, modern_hopfield_auto, mahalanobis]
  reps: [raw, whitened]
  full_bank:                 # `python contamination.py full`: the whitened geometry cell
    levels: [0.0, 0.05]      # at bank_cap null
    scorers: [knn, modern_hopfield, modern_hopfield_auto]
    reps: [whitened]
    features: [abs]

# ---- Robustness study: bank size (bank_size.py) ------------------------------
# Uniform random subsampling vs greedy k-center (PatchCore-style) coresets at
# decreasing bank caps, for the retrieval scorers on geometry features.
bank_size:
  caps: [12000, 4000, 1000]
  modes: [uniform, kcenter]
  seeds: [0, 1, 2]           # uniform: the subsample; kcenter: the greedy start point
  scorers: [knn, modern_hopfield, modern_hopfield_auto]
  reps: [raw, whitened]

# ---- Robustness study: corruption grid (`extract.py corrupt` + corruption.py) ----
# Corruptions hit the ORGANIZED xyz scan right after loading, BEFORE preprocessing, so
# RANSAC / DBSCAN / FPFH all run on corrupted geometry. Every corrupted cloud is
# regenerable: the rng is derived from (scan_id, family, severity) via
# src.repro.stable_rng. Corrupted caches get distinct suffixes (e.g.
# bagel_test_abs__gauss2.npz). Geometry (abs) only: the corruptions do not touch the RGB
# branch.
corruption:
  classes: [bagel, cable_gland]
  severities:                        # index 1..3 into each list; scale-relative
    gauss:     [0.001, 0.005, 0.01]  # per-point noise sigma = f * bbox diagonal
    occlusion: [0.10, 0.25, 0.40]    # fraction of valid pixels cut by a random half-plane
    density:   [0.50, 0.25, 0.10]    # fraction of valid pixels KEPT (random dropout)
    quantize:  [0.0005, 0.001, 0.002]  # z-quantization step = f * bbox diagonal
  regimes: [clean_bank, corrupted_bank]  # clean bank / corrupted test; corrupted both
  scorers:                           # detector configs evaluated on every grid cell
    - {scorer: knn, rep: raw}        # reference detector
    - {scorer: modern_hopfield_auto, rep: whitened}
  mitigation_cells: 3                # worst cells re-run with ransac/cleanup toggled
  seeds: [0, 1, 2]                   # `python corruption.py seeds`: re-score the
                                     # mitigation cells at several corruption draws (each
                                     # grid cell is a single deterministic draw)

# ---- Point-level localization (localize.py) ----------------------------------
# Back-project a scorer's per-patch anomaly (28x28) onto each anomalous scan's GT mask
# and report per-class pixel-AUROC and AUPRO.
localization:
  scorer: knn          # which scorer's patch anomaly to localize with
  rep: whitened        # raw | whitened
  viz_per_class: 4     # save this many 3-panel figures/class (RGB | anomaly overlay | GT)
                       # under results/figures/localization/; 0 = numbers only

# ---- RGB encoder comparison (encoders.py) ------------------------------------
# DINOv2 vs DINOv3 tokens (extract.py rgb / rgb_v3), image AUROC + pixel-AUROC + AUPRO.
encoders:
  features: [mm, mm_v3]
  scorer: knn
  rep: blockwise
  bank_cap: 12000

# ---- Fixed operating point (operating_point.py) ----------------------------
# Precision/recall/F1 at a threshold calibrated on the dataset's held-out NORMAL-ONLY
# `validation` split (extract.py validation), with no test-label exposure.
# target_fpr: percentile of the validation normality distribution used as the threshold
# (e.g. 0.05 -> 5th percentile, so ~5% of validation normals are flagged); the realized
# test FPR is reported alongside. Cost ratios (FN:FP) are illustrative, see the script.
operating_point:
  target_fpr: [0.01, 0.05, 0.10]

# ---- Timing / memory footprint (timing.py) -----------------------------------
# Scorer fit/score latency and fitted-scorer memory on the same bank_cap grid as
# bank_size.py, plus the full bank.
timing:
  n_scans_per_class: 3       # real scans/class timed through the extract.py pipeline
  caps: [1000, 4000, 12000, null]   # null = full bank per class
  repeats: 2                 # per (class, cap, scorer) fit/score timing; min taken (see timing.py)

# ---- Zero-shot cross-class generalization (cross_class.py) -----------------
# Fit the memory bank on class A's normals, score class B's test scans, for every
# (A, B) pair.
cross_class:
  scorer: knn
  rep: whitened
  features: abs        # geometry only: the question is whether a shape prior transfers

# ---- Background-plane ablation (plane_ablation.py) ---------------------------
# Re-extract these classes with ransac.enabled: false (cache suffix __nr) and score k-NN.
plane_ablation:
  classes: [carrot, cookie, cable_gland, tire]

# ---- k-NN + Mahalanobis hybrid on clean banks (hybrid.py) ---------------------
hybrid_study:
  bank_cap: 12000
  reps: [raw, whitened]

# ---- Defect-type strata ------------------------------------------------------
# Mapping of each test-folder defect type to a stratum (run.py reports the AUROC on
# the geometric stratum; FPFH cannot see appearance-only defects).
defect_map:
  bent: geometric
  crack: geometric
  cut: geometric
  hole: geometric
  open: geometric
  thread: geometric
  contamination: geometric   # surface deposit changes local shape
  color: appearance          # foam only; FPFH cannot see colour
  combined: mixed

# ---- Reproduction check ------------------------------------------------------
# `extract.py geom` (single-threaded Open3D 0.19.0, OMP_NUM_THREADS=1) is bit-
# deterministic, so raw k-NN(k=1) on the full bank must reproduce this 10-class mean
# image AUROC; run.py asserts it.
anchor_knn1_mean: 0.7563
